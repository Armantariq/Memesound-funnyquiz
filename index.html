<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c42f5">
<title>MemeSound Quiz — Play</title>
<style>
:root{--ink:#211b43;--purple:#6c42f5;--pink:#ff4fa3;--yellow:#ffd84d;--cyan:#49d8ef;--paper:#fffdf7;--green:#28c98b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff3a9,#ffd5e8 45%,#c9f8ff);color:var(--ink);min-height:100vh}
header{padding:18px 14px;text-align:center;background:linear-gradient(100deg,#7048ff,#ff4fa3);color:white;border-bottom:5px solid #211b43}
h1{margin:0;font-size:clamp(25px,6vw,38px);text-shadow:2px 3px #352079}header p{margin:6px 0 0;font-weight:700}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}
button,.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;font-size:15px;cursor:pointer;background:var(--yellow);color:#211b43;box-shadow:0 4px 0 #b98b13}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #b98b13}.primary{background:var(--purple);color:#fff;box-shadow:0 4px 0 #39219b}.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a92264}.green{background:var(--green);box-shadow:0 4px 0 #16845a}
main{max-width:850px;margin:auto;padding:0 12px 32px}.panel{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:23px;padding:17px;margin:10px 0;box-shadow:0 7px 0 rgba(33,27,67,.16)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}label{font-weight:800;display:block;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:2px solid #d5cffa;border-radius:12px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:70px}small,.muted{color:#665e87}.hidden{display:none!important}.badge{display:inline-block;background:#e8e0ff;padding:5px 10px;border-radius:99px;font-weight:800}.question{font-size:22px;font-weight:900;text-align:center;margin:8px 0}.soundbtn{display:block;margin:14px auto;font-size:18px;background:var(--cyan);box-shadow:0 4px 0 #16889a}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.answer{background:white;border:3px solid #d8d0ff;border-radius:16px;padding:10px;box-shadow:none;min-width:0}.answer img{width:100%;height:115px;object-fit:contain;background:#f5f2ff;border-radius:10px}.answer span{display:block;margin-top:7px;overflow-wrap:anywhere}.answer.correct{border-color:#18b77a;background:#e0fff1}.answer.wrong{border-color:#ff4f72;background:#fff0f3}.answer:disabled{opacity:1}.stat{font-size:14px;font-weight:900}.feedback{text-align:center;font-weight:900;min-height:26px;margin:10px 0}.optionrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:7px 0}.optionrow button{padding:8px 11px}.item{border:2px solid #e5ddff;padding:12px;border-radius:15px;margin:10px 0;background:#fff}.item strong{display:block}.filehint{font-size:12px;line-height:1.45}.footer{text-align:center;padding:15px;color:#50496d;font-size:12px}
@media(min-width:600px){.answer img{height:150px}.panel{padding:22px}}
</style></head>
<body>
<header><h1>🎧 MemeSound Quiz 🎮</h1><p>Hear it. Guess it. Flex your score!</p></header>
<nav><button class="primary" id="playTab">🎮 Play Quiz</button><button id="langBtn">🌐 English / اردو</button></nav>
<main>
<section id="playView">
<div class="panel">
<div class="row"><span class="badge" id="categoryBadge">All memes</span><span class="stat" id="progress">Question 1</span><span class="stat" id="score">Score: 0</span></div>
<div class="question" id="prompt">Which meme is this sound from?</div>
<button class="soundbtn" id="playSound">🔊 Play Sound</button>
<div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div>
<div class="row"><button id="nextBtn" class="primary" disabled>Next ➜</button><button id="restartBtn">↻ Restart</button></div>
<p class="muted filehint">Demo quiz. New questions will be added by the site owner. Use audio/images you own or have permission to use.</p>
</div>
</section>
</main><div class="footer">Bright gaming demo • Mobile-first • English + Roman Urdu</div>
<script>
const svgImage=(emoji,bg='#f5f2ff')=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220"><rect width="100%" height="100%" rx="20" fill="${bg}"/><text x="50%" y="53%" dominant-baseline="middle" text-anchor="middle" font-size="105">${emoji}</text></svg>`);
const questions=[
{name:'Dramatic moment',category:'International',options:[{text:'Dramatic violin',image:svgImage('🎻')},{text:'Cat meow',image:svgImage('🐱')},{text:'Cartoon bonk',image:svgImage('🔨')},{text:'Victory fanfare',image:svgImage('🏆')}],correct:0,demoTone:1},
{name:'Funny fail',category:'Random',options:[{text:'Funny fail',image:svgImage('😂')},{text:'Alarm clock',image:svgImage('⏰')},{text:'Rain sound',image:svgImage('🌧️')},{text:'Magic sparkle',image:svgImage('✨')}],correct:0,demoTone:2},
{name:'Victory sound',category:'Challenge',options:[{text:'Victory sound',image:svgImage('🏆')},{text:'Door knock',image:svgImage('🚪')},{text:'Dog bark',image:svgImage('🐶')},{text:'Phone ring',image:svgImage('📱')}],correct:0,demoTone:3}
];
let idx=0,score=0,answered=false,lang='en';
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tone(n){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=n===1?'triangle':'square';osc.frequency.value=[0,440,220,660][n]||330;gain.gain.setValueAtTime(.12,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.55);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.56)}catch(e){alert('Audio playback is not supported in this browser.')}}
function renderQuestion(){if(idx>=questions.length)idx=0;const q=questions[idx];answered=false;document.getElementById('categoryBadge').textContent=q.category;document.getElementById('progress').textContent=`Question ${idx+1} / ${questions.length}`;document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('prompt').textContent=lang==='en'?'Which meme is this sound from?':'Ye sound kis meme ki hai?';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;document.getElementById('nextBtn').textContent=lang==='en'?'Next ➜':'Agla ➜';document.getElementById('answers').innerHTML=q.options.map((o,i)=>`<button class="answer" data-i="${i}"><img src="${o.image}" alt=""><span>${esc(o.text)}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.i));}
function playCurrent(){tone(questions[idx].demoTone||1)}
function choose(n){if(answered)return;answered=true;const q=questions[idx];document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');if(i===n&&n!==q.correct)b.classList.add('wrong')});if(n===q.correct){score+=10;document.getElementById('feedback').textContent=lang==='en'?'🎉 Correct! +10 points':'🎉 Sahi jawab! +10 points'}else document.getElementById('feedback').textContent=(lang==='en'?'Not quite! Correct answer: ':'Sahi jawab: ')+q.options[q.correct].text;document.getElementById('score').textContent='Score: '+score;document.getElementById('nextBtn').disabled=false}
document.getElementById('langBtn').onclick=()=>{lang=lang==='en'?'ur':'en';document.getElementById('langBtn').textContent=lang==='en'?'🌐 English / اردو':'🌐 اردو / English';renderQuestion()};
document.getElementById('playSound').onclick=playCurrent;document.getElementById('nextBtn').onclick=()=>{idx=(idx+1)%questions.length;renderQuestion()};document.getElementById('restartBtn').onclick=()=>{idx=0;score=0;renderQuestion()};
renderQuestion();
</script></body></html>
